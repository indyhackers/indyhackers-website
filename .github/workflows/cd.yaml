name: cd

on:
  workflow_call:
    inputs:
      image:
        type: string
        required: true
      ssh_host:
        type: string
        required: true
      ssh_user:
        type: string
        required: true
    secrets:
      ts_oauth_client_id:
        required: true
      ts_oauth_secret:
        required: true
      ssh_key:
        required: true
      slack_webhook:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:

      - name: Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.ts_oauth_client_id }}
          oauth-secret: ${{ secrets.ts_oauth_secret }}
          tags: "tag:ci"

      - name: SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ssh_key }}

      - name: Deploy image on host
        run: |
          #stop running containers
          ssh -o StrictHostKeyChecking=accept-new ${{ inputs.SSH_USER }}@${{ inputs.SSH_HOST }} docker stop indyhackers || true
          ssh -o StrictHostKeyChecking=accept-new ${{ inputs.SSH_USER }}@${{ inputs.SSH_HOST }} docker rm indyhackers || true
          
          #run new image
          ssh -o StrictHostKeyChecking=accept-new ${{ inputs.SSH_USER }}@${{ inputs.SSH_HOST }} docker run --name indyhackers --env-file=.env --restart always -p 127.0.0.1:32768:8090 -p "'[::1]:32768:8090'" -v ./pb/data:/pb_data -d ${{ inputs.image }}

          curl -X POST -H 'Content-type: application/json' \
            --data '{"text":"New image deployed to ${{ inputs.SSH_HOST }}: `${{ inputs.image }}`"}' \
            ${{ secrets.slack_webhook }}