name: cd

on:
  workflow_call:
    inputs:
      image:
        type: string
        required: true
      ssh_host:
        type: string
        required: true
      ssh_user:
        type: string
        required: true
    secrets:
      ts_oauth_client_id:
        required: true
      ts_oauth_secret:
        required: true
      ssh_key:
        required: true
      slack_webhook:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:

      - name: Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.ts_oauth_client_id }}
          oauth-secret: ${{ secrets.ts_oauth_secret }}
          tags: "tag:ci"

      - name: SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ssh_key }}

      - name: Deploy image on host
        run: |
          #stop running containers
          ssh -o StrictHostKeyChecking=accept-new ${{ inputs.SSH_USER }}@${{ inputs.SSH_HOST }} docker stop indyhackers || true
          ssh -o StrictHostKeyChecking=accept-new ${{ inputs.SSH_USER }}@${{ inputs.SSH_HOST }} docker rm indyhackers || true
          
          # The container runs as uid/gid 1001 (the host's indyhackers user), not
          # root. Make sure the data dir is owned by it first, or PocketBase can't
          # write its database. Data written by older root containers is uid 0, so
          # this does the one-time migration and is a no-op on later deploys. It
          # runs through docker because the deploy user has no sudo.
          ssh -o StrictHostKeyChecking=accept-new ${{ inputs.SSH_USER }}@${{ inputs.SSH_HOST }} docker run --rm -v ./pb/data:/pb_data --entrypoint chown ${{ inputs.image }} -R 1001:1001 /pb_data

          #run new image: unprivileged, no capabilities, no privilege escalation,
          #bounded memory/processes, reachable only from localhost (cloudflared)
          ssh -o StrictHostKeyChecking=accept-new ${{ inputs.SSH_USER }}@${{ inputs.SSH_HOST }} docker run --name indyhackers --env-file=.env --restart always \
            --user 1001:1001 --cap-drop ALL --security-opt no-new-privileges \
            --memory 1g --pids-limit 512 \
            -p 127.0.0.1:32768:8090 -p "'[::1]:32768:8090'" -v ./pb/data:/pb_data -d ${{ inputs.image }}

          curl -X POST -H 'Content-type: application/json' \
            --data '{"text":"New image deployed to ${{ inputs.SSH_HOST }}: `${{ inputs.image }}`"}' \
            ${{ secrets.slack_webhook }}